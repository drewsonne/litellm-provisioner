apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm-provisioner
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: litellm-provisioner
  template:
    metadata:
      labels:
        app: litellm-provisioner
    spec:
      serviceAccountName: litellm-provisioner
      terminationGracePeriodSeconds: 60
      containers:
        - name: controller
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 200m, memory: 256Mi}
          livenessProbe:
            httpGet: {path: /healthz, port: 8080}
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
          env:
            - name: LITELLM_URL
              value: {{ .Values.litellm.url | quote }}
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.litellm.masterKeySecret.name }}
                  key: {{ .Values.litellm.masterKeySecret.key }}
