apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: litellmkeys.litellm.drewsonne.github.io
  annotations:
    helm.sh/resource-policy: keep
spec:
  group: litellm.drewsonne.github.io
  scope: Namespaced
  names:
    plural: litellmkeys
    singular: litellmkey
    kind: LiteLLMKey
    shortNames: [llmkey]
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - {name: Alias, type: string, jsonPath: .spec.alias}
        - {name: Ready, type: boolean, jsonPath: .status.ready}
        - {name: Message, type: string, jsonPath: .status.message}
        - {name: Age, type: date, jsonPath: .metadata.creationTimestamp}
      schema:
        openAPIV3Schema:
          type: object
          required: ["spec"]
          properties:
            spec:
              type: object
              required: ["alias", "models", "maxBudget", "budgetDuration", "secretName"]
              properties:
                alias:
                  type: string
                  description: "key_alias in LiteLLM; shown in its logs and UI. Must be unique."
                  minLength: 1
                  maxLength: 128
                models:
                  type: array
                  minItems: 1
                  items: {type: string, minLength: 1}
                maxBudget:
                  type: number
                  minimum: 0
                  description: "US dollars per budgetDuration."
                budgetDuration:
                  type: string
                  pattern: "^[0-9]+[smhd]$"
                  description: "Budget reset period, e.g. 7d."
                secretName:
                  type: string
                  minLength: 1
                  maxLength: 253
                  description: "Secret in this namespace; the key is in field api_key."
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
